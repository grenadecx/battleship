[workspace]
members = ["crates/core", "crates/game", "crates/server"]
resolver = "3"

# The version every crate shares; scripts/release.sh bumps it here.
[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
battleship-core = { path = "crates/core" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
