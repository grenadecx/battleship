name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  mutants:
    # The prebuilt cargo-mutants needs glibc 2.39, which 22.04 does not have.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Mutate the lines this PR changes
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}... > pr.diff
          cargo mutants --no-shuffle --in-diff pr.diff
      - name: Mutate everything
        if: github.event_name != 'pull_request'
        run: cargo mutants --no-shuffle
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out
