[package]
name = "battleship-server"
version.workspace = true
edition.workspace = true
description = "Serves the browser version of Battleship and relays games between browser players"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
battleship-core.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
